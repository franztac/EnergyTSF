meta:
  data_name: ECL
  model_name: gru
  token_style: time
  window: 96
  horizon: 96
  channels: 321

fixed_params: {}

search_space:
  lr:
    type: float
    low: 1.0e-4
    high: 5.0e-4
    log: true

  weight_decay:
    type: float
    low: 1.0e-5
    high: 1.0e-4
    log: true

  d_model:
    type: categorical
    choices: [512, 1024]

  num_layers:
    type: categorical
    choices: [1, 2]

  pooling:
    type: categorical
    choices: ["last"]

  bidirectional:
    type: categorical
    choices: [false]

  temperature:
    type: float
    low: 0.8
    high: 1.5
    log: false

  dropout:
    type: float
    low: 0.09
    high: 0.13
    log: false

  scheduler_factor:
    type: float
    low: 0.50
    high: 0.60
    log: false

  scheduler_patience:
    type: categorical
    choices: [2, 3]