meta:
  data_name: ETTh1
  model_name: mamba
  token_style: time
  window: 96
  horizon: 96
  channels: 7

fixed_params:
  dt_rank: auto
  dt_min: 0.001
  dt_max: 0.1
  use_fast_path: true

search_space:
  lr:
    type: float
    low: 1.1e-4
    high: 2.0e-4
    log: true

  weight_decay:
    type: float
    low: 1.0e-5
    high: 3.0e-5
    log: true

  d_model:
    type: categorical
    choices: [128, 512]

  num_layers:
    type: categorical
    choices: [2, 3]

  d_state:
    type: categorical
    choices: [2, 4]

  expand:
    type: categorical
    choices: [2]

  d_conv:
    type: categorical
    choices: [4]

  d_ff:
    type: categorical
    choices: [128]

  pooling:
    type: categorical
    choices: ["last"]

  bidirectional:
    type: categorical
    choices: [false]

  temperature:
    type: float
    low: 0.8
    high: 1.5
    log: false

  dropout:
    type: float
    low: 0.10
    high: 0.20
    log: false

  scheduler_factor:
    type: float
    low: 0.52
    high: 0.60
    log: false

  scheduler_patience:
    type: categorical
    choices: [2, 3]