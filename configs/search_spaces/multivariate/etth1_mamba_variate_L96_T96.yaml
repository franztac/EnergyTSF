meta:
  data_name: ETTh1
  model_name: mamba
  token_style: variate
  window: 96
  horizon: 96
  channels: 7

fixed_params:
  dt_rank: auto
  dt_min: 0.001
  dt_max: 0.1
  use_fast_path: true

search_space:
  lr:
    type: float
    low: 6.0e-5
    high: 1.0e-4
    log: true

  weight_decay:
    type: float
    low: 1.0e-6
    high: 4.0e-6
    log: true

  d_model:
    type: categorical
    choices: [128]

  num_layers:
    type: categorical
    choices: [2]

  d_state:
    type: categorical
    choices: [4]

  expand:
    type: categorical
    choices: [1]

  d_conv:
    type: categorical
    choices: [4]

  d_ff:
    type: categorical
    choices: [256]

  dropout:
    type: float
    low: 0.05
    high: 0.10
    log: false

  scheduler_factor:
    type: float
    low: 0.47
    high: 0.56
    log: false

  scheduler_patience:
    type: categorical
    choices: [3]