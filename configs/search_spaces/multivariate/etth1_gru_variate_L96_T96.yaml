meta:
  data_name: ETTh1
  model_name: gru
  token_style: variate
  window: 96
  horizon: 96
  channels: 7

fixed_params: {}

search_space:
  lr:
    type: float
    low: 3.0e-4
    high: 7.0e-4
    log: true

  weight_decay:
    type: float
    low: 1.0e-6
    high: 2.5e-5
    log: true

  d_model:
    type: categorical
    choices: [256]

  num_layers:
    type: categorical
    choices: [1, 2]

  bidirectional:
    type: categorical
    choices: [true]

  dropout:
    type: float
    low: 0.05
    high: 0.13
    log: false

  scheduler_factor:
    type: float
    low: 0.46
    high: 0.58
    log: false

  scheduler_patience:
    type: categorical
    choices: [5]