meta:
  data_name: ECL
  model_name: transformer
  token_style: variate
  window: 96
  horizon: 96
  channels: 321

fixed_params:
  layer_norm_eps: 1.0e-5
  batch_first: true

search_space:
  lr:
    type: float
    low: 3.3e-4
    high: 7.2e-4
    log: true

  weight_decay:
    type: float
    low: 1.0e-6
    high: 1.0e-5
    log: true

  d_model:
    type: categorical
    choices: [512]

  num_layers:
    type: categorical
    choices: [2, 3]

  nhead:
    type: categorical
    choices: [8]

  dim_feedforward:
    type: categorical
    choices: [1024]

  activation:
    type: categorical
    choices: ["gelu", "relu"]

  norm_first:
    type: categorical
    choices: [true]

  dropout:
    type: float
    low: 0.05
    high: 0.08
    log: false

  scheduler_factor:
    type: float
    low: 0.47
    high: 0.57
    log: false

  scheduler_patience:
    type: categorical
    choices: [3, 4, 5]