meta:
  data_name: ECL
  model_name: mamba
  token_style: variate
  window: 96
  horizon: 96
  channels: 321

fixed_params:
  dt_rank: auto
  dt_min: 0.001
  dt_max: 0.1
  use_fast_path: true

search_space:
  lr:
    type: float
    low: 6.5e-4
    high: 1.1e-3
    log: true

  weight_decay:
    type: float
    low: 1.0e-6
    high: 6.0e-6
    log: true

  d_model:
    type: categorical
    choices: [256]

  num_layers:
    type: categorical
    choices: [1]

  d_state:
    type: categorical
    choices: [8]

  expand:
    type: categorical
    choices: [2, 4]

  d_conv:
    type: categorical
    choices: [2]

  d_ff:
    type: categorical
    choices: [512]

  dropout:
    type: float
    low: 0.20
    high: 0.28
    log: false

  scheduler_factor:
    type: float
    low: 0.40
    high: 0.48
    log: false

  scheduler_patience:
    type: categorical
    choices: [2, 3, 4]